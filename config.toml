[routing]
default_tier = "low_cost"

[routing.tiers.free]
provider = "ollama"
models = ["llama3.2:1b"]

[routing.tiers.low_cost]
antigravity = []
opencode = ["opencode/deepseek-v4-flash-free", "opencode/laguna-s-2.1-free", "opencode/mimo-v2.5-free", "opencode/nemotron-3-ultra-free", "opencode/north-mini-code-free", "openrouter/openrouter/free", "openrouter/nvidia/nemotron-3-nano-30b-a3b:free", "openrouter/openai/gpt-oss-20b:free"]
codex = []
google = []
openrouter = []
openai_oauth = []

[routing.tiers.high_cost]
antigravity = []
opencode = ["openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"]
google = []
openrouter = []
openai_oauth = []

[routing.fallback]
chain = ["primary", "opencode"]

[doctor]
scoring_variance_threshold = 0.01
scoring_window_size = 10
inotify_min_watches = 65536

[memory]
embedding_model = "nomic-embed-text"
embedding_dimension = 768

[providers.ollama]
base_url = "http://localhost:11434"
timeout_seconds = 30

[providers.antigravity]
timeout_seconds = 60

[providers.opencode]
timeout_seconds = 60

[providers.google]
timeout_seconds = 60

[providers.openrouter]
timeout_seconds = 60

[providers.openai_oauth]
timeout_seconds = 60

[permissions]
require_confirmation_packages = true
require_confirmation_config_writes = true
prohibited_patterns = []
required_patterns = []
safe_patterns = []
notify_timeout_seconds = 120.0

[cli]
# Theme: "jules" (custom colors) or "terminal" (respects your terminal colorscheme)
theme = "terminal"
